<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Locks the screen scale to prevent accidental zooming during gameplay -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Primary Meta Tags (SEO & AI Search) -->
    <title>Obscura | Stealth Strategy Game by Cellflow</title>
    <meta name="title" content="Obscura | Stealth Strategy Game by Cellflow">
    <meta name="description" content="Play Obscura, a top-down stealth strategy web game developed by Cellflow. Navigate puzzles, avoid detection, and secure the target in this fast-paced PWA.">
    <meta name="author" content="Cellflow">
    <meta name="keywords" content="stealth game, web game, Cellflow, PWA, browser game, top-down strategy, Obscura">

    <!-- Open Graph / Social Sharing (Facebook, LinkedIn, Discord) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cellflow24.github.io/Obscura/">
    <meta property="og:title" content="Obscura | Stealth Strategy Game by Cellflow">
    <meta property="og:description" content="Navigate puzzles, avoid detection, and secure the target in this stealth web game developed by Cellflow.">
    <meta property="og:image" content="./Stock/logo.png">

    <!-- Twitter Card -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://cellflow24.github.io/Obscura/">
    <meta property="twitter:title" content="Obscura | Stealth Strategy Game by Cellflow">
    <meta property="twitter:description" content="Play Obscura, a top-down stealth strategy web game developed by Cellflow.">
    <meta property="twitter:image" content="./Stock/logo.png">

    <!-- PWA & Mobile App Optimization -->
    <meta name="theme-color" content="#050811"> 
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="./Stock/logo.png">
    <link rel="apple-touch-icon" href="./Stock/logo.png">
    <link rel="manifest" href="manifest.json">

    <!-- AI Search Engine Optimization (Schema.org JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "VideoGame",
      "name": "Obscura",
      "description": "A top-down stealth strategy web game where players navigate puzzles and avoid detection to secure targets. Engineered as a serverless PWA.",
      "genre": ["Stealth", "Puzzle", "Strategy"],
      "publisher": {
        "@type": "Organization",
        "name": "Cellflow",
        "url": "https://cellflow24.github.io/"
      },
      "creator": {
        "@type": "Organization",
        "name": "Cellflow"
      },
      "playMode": "SinglePlayer",
      "applicationCategory": "Game",
      "operatingSystem": "Web Browser, Android, iOS"
    }
    </script>

    <!-- Google Fonts for AAA Game Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <!-- Base Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Game Canvas (Hidden until start) -->
    <canvas id="game-canvas"></canvas>

    <!-- UI Overlay: Start Screen -->
    <div id="start-screen" class="ui-layer active">
        <!-- The animated tactical grid background -->
        <div class="tactical-grid"></div>

        <div class="title-container">
            <img src="./Stock/logo.png" alt="Obscura" class="game-logo floating pulse-glow">
            <h1 class="game-title">OBSCURA</h1>
            <p class="game-subtitle">A STEALTH STRATEGY BY CELLFLOW</p>
        </div>
        
        <button id="start-btn" class="cyber-button">
            <span>START OPERATION</span>
        </button>
    </div>

    <!-- UI Overlay: Difficulty Selection (Hidden initially) -->
    <div id="difficulty-screen" class="ui-layer">
        <div class="tactical-grid"></div>
        <div class="title-container diff-title">
            <h2 class="game-title" style="font-size: 3rem;">SELECT DIFFICULTY</h2>
            <p class="game-subtitle">LEVEL 1 / 10</p>
        </div>
        
        <div class="difficulty-options">
            <button class="cyber-button diff-btn" data-diff="easy"><span>EASY</span></button>
            <button class="cyber-button diff-btn" data-diff="medium"><span>MEDIUM</span></button>
            <button class="cyber-button diff-btn" data-diff="hard"><span>HARD</span></button>
        </div>
    </div>

    <!-- Link the logic -->
    <script src="script.js"></script>
</body>
</html>
